name: Actualizar Servicios Consulares

on:
  schedule:
    # Runs Monday, Wednesday, and Friday evenings at 21:XX UTC (with randomness)
    - cron: '17 21 * * 1'  # Monday at 21:17 UTC
    - cron: '43 21 * * 3'  # Wednesday at 21:43 UTC
    - cron: '29 21 * * 5'  # Friday at 21:29 UTC
  workflow_dispatch: # Allows manual execution of the workflow

jobs:
  actualizar-contenidos:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: develop 

    - name: Configure Git
      run: |
        git config --local user.email "jumacuca@gmail.com"
        git config --local user.name "JuanMa Cuevas"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip 
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 markdownify fake-useragent; fi

    - name: Run scraping script
      run: python download-servicios-consulares.py
      
    - name: Check for changes
      id: git-check
      run: |
        git status --porcelain
        echo "changes=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.git-check.outputs.changes > 0
      run: |
        git add .
        git commit -m "Auto-update: Servicios Consulares $(date +'%Y-%m-%d')"
        git push origin develop